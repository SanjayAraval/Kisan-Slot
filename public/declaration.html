<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tonight's Declaration</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#16241C" />
<link rel="stylesheet" href="/theme.css" />
<style>
  body { max-width: 760px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-8); }
  h1 { font-size: 1.3rem; }
  .sub { color: var(--ink-60); margin-bottom: var(--space-5); font-size: 0.9rem; }
  fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); margin: 0 0 var(--space-4); }
  legend { padding: 0 var(--space-2); font-weight: 700; font-size: 0.95rem; }
  /* Tablet target: .field-grid-2 (theme.css) stacks fields one-per-row
     on a phone and goes two-up from 768px. */
  .field-grid-2 .field, .field-grid-2 > div { margin-bottom: 0; }

  .stepper { display: flex; align-items: center; gap: var(--space-2); }
  .stepper button {
    width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer; flex: none;
    border: 1px solid var(--line); background: var(--ink-06); border-radius: var(--radius-sm); color: var(--ink);
  }
  .stepper button:hover { background: var(--ink-10); }
  .stepper button:disabled { opacity: 0.5; cursor: default; }
  .stepper input { width: 6.5rem; text-align: center; min-height: 44px; }
  .actions { display: flex; gap: var(--space-3); margin-top: var(--space-4); flex-wrap: wrap; }
  .infra { font-size: 0.85rem; color: var(--ink-60); background: var(--ink-06); border-radius: var(--radius-sm); padding: var(--space-3); margin-bottom: var(--space-4); }
  .result h2 { font-size: 1.1rem; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
  @media (min-width: 768px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-3); }
  .stat .n { font-size: 1.4rem; font-weight: 700; }
  .stat .l { font-size: 0.78rem; color: var(--ink-60); }
  tr.binding td { color: var(--red-ink); font-weight: 700; }
  tr.binding { background: var(--red-bg); }
  .link-btn { background: none; border: none; color: var(--green); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; min-height: auto; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="/validation.js"></script>
<script>
'use strict';
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
const h = React.createElement;

// Baseline used only when a centre has no declaration on file yet for
// the chosen date -- lets the officer complete a first declaration
// instead of hitting a dead end. Mirrors the seed script's baseline.
const DEFAULT_INPUTS = {
  weighingMode: 'weighbridge',
  weighbridgeOperatingMinutes: 480,
  weighbridgeAvgCycleMinutes: 8,
  secondsPerBag: null,
  avgBagsPerLot: null,
  hamaliGangCount: 10,
  hamaliBagsPerGangPerDay: 600,
  bagsPerTruck: 100,
  gunnyBagsAvailable: 6000,
  truckEvacuationCapacity: 60,
  yardCapacityTonnes: 600,
  undispatchedTonnes: 0,
  avgTruckLoadTonnes: 10,
  moistureMeterCount: 5,
  moistureTestsPerMeterPerDay: 100,
};

// Mirrors declarationRoutes.js's GUNNY_BAGS_MAX / HAMALI_GANG_MAX /
// TRUCK_EVACUATION_MAX -- same plausible ceilings, checked here too so a
// stray extra zero is caught at the field, not after a round trip to the
// server.
const GUNNY_BAGS_MAX = 200000;
const HAMALI_GANG_MAX = 500;
const TRUCK_EVACUATION_MAX = 2000;

const CONSTRAINT_LABELS = {
  weighbridge: 'Weighing (weighbridge / platform)',
  hamali: 'Hamali labour gangs',
  gunny: 'Gunny bag stock',
  truckEvacuation: 'Truck evacuation',
  yardSpace: 'Yard space',
  moistureTesting: 'Moisture testing',
};

// Formats using the browser's local calendar date -- never toISOString(),
// which converts to UTC and silently shifts the date for any timezone
// ahead of UTC (e.g. IST) during the hours after local midnight but
// before UTC midnight.
function formatLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function today() {
  return formatLocalDate(new Date());
}

function todayPlusOne() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return formatLocalDate(d);
}

async function fetchJson(url, options) {
  const res = await fetch(url, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok && res.status !== 404) {
    throw new Error((body && (body.message || (body.errors || []).join(', '))) || `request failed (${res.status})`);
  }
  return { status: res.status, body };
}

function Stepper({ label, value, onChange, step, hint, min = 1, max, error, disabled }) {
  return h('div', { className: 'field' },
    h('label', null, label + (hint ? ` (${hint})` : '')),
    h('div', { className: 'stepper' },
      h('button', {
        type: 'button', disabled, 'aria-label': `Decrease ${label}`,
        onClick: () => onChange(Math.max(min, value - step)),
      }, '−'),
      h('input', {
        type: 'number',
        className: error ? 'err num' : 'num',
        value: value,
        min: min,
        max: max,
        disabled,
        'aria-invalid': !!error,
        onChange: (e) => {
          const n = Number(e.target.value);
          onChange(Number.isFinite(n) ? n : min);
        },
      }),
      h('button', {
        type: 'button', disabled, 'aria-label': `Increase ${label}`,
        onClick: () => onChange(max != null ? Math.min(max, value + step) : value + step),
      }, '+')
    ),
    error && h('div', { className: 'field-error' }, error)
  );
}

function StatCard(props) {
  return h('div', { className: 'stat' },
    h('div', { className: 'n num' }, props.value),
    h('div', { className: 'l' }, props.label)
  );
}

function ResultPanel({ result }) {
  if (!result) return null;
  // bindingConstraints holds every constraint tied at the minimum, in the
  // engine's deterministic CONSTRAINT_ORDER -- bindingConstraint is just
  // its first entry. Fall back to the singular field for older responses.
  const tied = result.bindingConstraints || [result.bindingConstraint];
  const label = tied.map((key) => CONSTRAINT_LABELS[key] || key).join(' & ');
  return h('div', { className: 'result' },
    h('h2', null, 'Recomputed capacity'),
    h('div', { className: 'stat-grid' },
      h(StatCard, { value: result.totalCapacity, label: 'Total capacity (lots/day)' }),
      h(StatCard, { value: result.bookableCapacity, label: 'Bookable slots' }),
      h(StatCard, { value: result.walkInReserved, label: 'Walk-in reserve' }),
      h(StatCard, { value: label, label: tied.length > 1 ? 'Binding constraints (tied)' : 'Binding constraint' })
    ),
    result.recommendedAction && h('div', { className: 'callout callout-warning', style: { fontSize: '0.92rem', marginBottom: 'var(--space-4)' } },
      h('strong', null, 'Recommended action: '), result.recommendedAction
    ),
    h('div', { className: 'table-scroll' }, h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Constraint'), h('th', null, 'Lots/day it supports'))),
      h('tbody', null,
        Object.entries(result.constraints).map(([key, val]) =>
          h('tr', { key: key, className: tied.includes(key) ? 'binding' : '' },
            h('td', null, CONSTRAINT_LABELS[key] || key),
            h('td', { className: 'num' }, val)
          )
        )
      )
    ))
  );
}

function App() {
  const [session, setSession] = React.useState({ loading: true, role: null, centreId: null, name: null });
  const [centres, setCentres] = React.useState([]);
  const [centresLoading, setCentresLoading] = React.useState(true);
  const [centreId, setCentreId] = React.useState('');
  const [date, setDate] = React.useState(todayPlusOne());
  const [inputs, setInputs] = React.useState(null);
  const [loadMsg, setLoadMsg] = React.useState(null);
  const [submitting, setSubmitting] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [result, setResult] = React.useState(null);

  // Only centre and district officers declare -- redirect anyone else
  // (or anyone not logged in) to the shared login screen.
  React.useEffect(() => {
    fetchJson('/api/auth/me')
      .then(({ status, body }) => {
        if (status !== 200 || (body.role !== 'centre_officer' && body.role !== 'district_officer')) {
          window.location.href = '/login.html';
          return;
        }
        setSession({ loading: false, role: body.role, centreId: body.centreId, name: body.name });
      })
      .catch(() => { window.location.href = '/login.html'; });
  }, []);

  React.useEffect(() => {
    if (session.loading) return;
    setCentresLoading(true);
    fetchJson('/api/centres')
      .then(({ body }) => {
        setCentres(body);
        // A centre officer is locked to their own assigned centre; a
        // district officer keeps the full picker (the server still
        // rejects a centre outside their district either way).
        if (session.role === 'centre_officer' && session.centreId) {
          setCentreId(session.centreId);
        } else if (body.length > 0) {
          setCentreId(body[0].id);
        }
      })
      .catch((err) => setError(err.message))
      .finally(() => setCentresLoading(false));
  }, [session.loading]); // eslint-disable-line react-hooks/exhaustive-deps

  async function logout() {
    await fetchJson('/api/auth/logout', { method: 'POST' }).catch(() => {});
    window.location.href = '/login.html';
  }

  // Edits a single declared input and, critically, drops any previously
  // computed result along with it -- `result` is a snapshot of what the
  // server returned for whatever was last actually submitted, and once
  // any field changes it no longer describes what's on screen (e.g. a
  // stale "totalCapacity: 0, binding: gunny" from an earlier low gunny
  // count staying visible after bumping the stepper to 510 would make
  // the recomputed-capacity panel contradict the very field it's next
  // to). Recomputing only happens by submitting again.
  function updateInput(field, value) {
    setInputs({ ...inputs, [field]: value });
    setResult(null);
  }

  async function loadDeclaration() {
    if (!centreId || !date) return;
    setLoading(true);
    setError(null);
    setResult(null);
    setLoadMsg(null);
    try {
      const { status, body } = await fetchJson(`/api/centres/${centreId}/declaration?date=${date}`);
      if (status === 404) {
        setInputs({ ...DEFAULT_INPUTS });
        setLoadMsg('No declaration on file for this date yet -- starting from baseline values below.');
      } else {
        setInputs(body.inputs);
        setLoadMsg(null);
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  async function submitDeclaration() {
    setSubmitting(true);
    setError(null);
    // Clears the "no declaration on file yet" banner from the load that
    // got us here -- once a submit is in flight (successful or not) that
    // banner no longer describes the current state, and leaving it up
    // let it sit alongside a same-screen 409 CONFLICT error claiming the
    // opposite: that a declaration *does* exist and was just changed by
    // someone else.
    setLoadMsg(null);
    try {
      // expectedUpdatedAt is whatever this form last loaded -- if the
      // dashboard released bags (or another officer declared) since
      // then, the server rejects this as stale instead of silently
      // overwriting that change.
      const { status, body } = await fetchJson(`/api/centres/${centreId}/declaration`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...inputs, date, expectedUpdatedAt: inputs.updatedAt || null }),
      });
      // fetchJson only special-cases 404 as "not an error" for the GET
      // declaration lookup (no declaration on file yet is expected
      // there) -- for a submit, 404 means the centre itself is gone,
      // which is a real failure and must not be rendered as if it were
      // a successful recomputed-capacity result.
      if (status !== 200) {
        setError(body.message || (body.errors || []).join(', ') || 'Something went wrong. Please try again.');
        return;
      }
      setResult(body);
      // Carry the new version forward so a second submit in the same
      // session (without reloading) isn't rejected against itself.
      setInputs({ ...inputs, updatedAt: body.updatedAt });
    } catch (err) {
      setError(err.message);
    } finally {
      setSubmitting(false);
    }
  }

  if (session.loading) {
    return h('div', { className: 'loading-row', style: { padding: 'var(--space-5) var(--space-4)' } },
      h('span', { className: 'spinner' }), 'Checking your session…'
    );
  }

  const lockedCentre = session.role === 'centre_officer' ? centres.find((c) => c.id === centreId) : null;
  // Tonight's declaration is an attestation of what's physically on hand
  // at one centre -- only that centre's own officer can submit it (the
  // server enforces this too; see requireCentreOfficerScope). A district
  // officer can still load and read it here for oversight.
  const isDistrictOfficer = session.role === 'district_officer';

  return h('div', null,
    h('h1', null, "Tonight's Declaration"),
    h('p', { className: 'sub' }, "Declare tomorrow's operating inputs and see the recomputed capacity."),
    // The dashboard is district_officer-only, and the live queue is
    // centre_officer-only -- each role only ever sees its own link. The
    // farmer screen isn't linked at all: no officer role can use it.
    session.role === 'district_officer' && h('p', { style: { fontSize: '0.85rem', marginTop: '-0.75rem', marginBottom: 'var(--space-2)' } },
      h('a', { href: '/dashboard.html' }, 'District officer dashboard →')
    ),
    session.role === 'centre_officer' && h('p', { style: { fontSize: '0.85rem', marginTop: '-0.75rem', marginBottom: 'var(--space-2)' } },
      h('a', { href: '/queue.html' }, 'Live queue →')
    ),
    h('p', { style: { fontSize: '0.8rem', color: 'var(--ink-60)', marginTop: 0, marginBottom: 'var(--space-4)' } },
      `Logged in as ${session.name} (${session.role.replace('_', ' ')})`, ' · ',
      h('button', { className: 'link-btn', onClick: logout }, 'Log out')
    ),

    error && h('div', { className: 'callout callout-danger', style: { marginBottom: 'var(--space-4)' } }, error),

    h('fieldset', null,
      h('legend', null, 'Centre & date'),
      h('div', { className: 'field-grid field-grid-2' },
        h('div', { className: 'field' },
          h('label', null, 'Centre'),
          centresLoading
            ? h('div', { className: 'loading-row', style: { padding: '0.6rem 0' } }, h('span', { className: 'spinner' }), 'Loading centres…')
            : centres.length === 0
            ? h('div', { className: 'field-hint' }, 'No centres found.')
            : lockedCentre
            ? h('div', { style: { padding: '0.65rem 0', fontWeight: 700 } }, `${lockedCentre.name} (${lockedCentre.code})`)
            : h('select', { value: centreId, onChange: (e) => setCentreId(e.target.value) },
                centres.map((c) => h('option', { key: c.id, value: c.id }, `${c.name} (${c.code})`))
              )
        ),
        h('div', { className: 'field' },
          h('label', null, 'Date'),
          h('input', { type: 'date', value: date, min: today(), onChange: (e) => setDate(e.target.value) })
        )
      ),
      h('button', { className: 'btn btn-secondary btn-sm', onClick: loadDeclaration, disabled: loading || !centreId || !date },
        loading && h('span', { className: 'spinner' }),
        loading ? 'Loading…' : 'Load declaration'
      )
    ),

    inputs && h('fieldset', null,
      h('legend', null, "Tonight's inputs"),
      loadMsg && h('div', { className: 'callout', style: { marginBottom: 'var(--space-4)', fontSize: '0.88rem' } }, loadMsg),
      isDistrictOfficer && h('div', { className: 'callout', style: { marginBottom: 'var(--space-4)', fontSize: '0.88rem' } },
        "Read-only: you're viewing this for district oversight. Only this centre's own officer can submit its declaration."
      ),
      h('div', { className: 'infra' },
        `Weighing mode: ${inputs.weighingMode}` +
        (inputs.weighingMode === 'weighbridge'
          ? `, cycle ${inputs.weighbridgeAvgCycleMinutes} min`
          : `, ${inputs.secondsPerBag}s/bag × ${inputs.avgBagsPerLot} bags/lot`) +
        ` • ${inputs.bagsPerTruck} bags/truck • yard ${inputs.yardCapacityTonnes}t (${inputs.undispatchedTonnes}t undispatched) • ` +
        `${inputs.moistureMeterCount} moisture meters. These are fixed infrastructure values, not editable here.`
      ),
      h('div', { className: 'field-grid field-grid-2' },
        h(Stepper, {
          label: 'Gunny bags in stock',
          value: inputs.gunnyBagsAvailable,
          step: 50,
          max: GUNNY_BAGS_MAX,
          disabled: submitting || isDistrictOfficer,
          error: KisanValidation.validatePositiveIntegerInBounds(inputs.gunnyBagsAvailable, { max: GUNNY_BAGS_MAX, label: 'Gunny bags in stock' }),
          onChange: (v) => updateInput('gunnyBagsAvailable', v),
        }),
        h(Stepper, {
          label: 'Hamali gangs available',
          value: inputs.hamaliGangCount,
          step: 1,
          max: HAMALI_GANG_MAX,
          disabled: submitting || isDistrictOfficer,
          error: KisanValidation.validatePositiveIntegerInBounds(inputs.hamaliGangCount, { max: HAMALI_GANG_MAX, label: 'Hamali gangs available' }),
          onChange: (v) => updateInput('hamaliGangCount', v),
        }),
        h(Stepper, {
          label: 'Trucks for evacuation',
          value: inputs.truckEvacuationCapacity,
          step: 1,
          max: TRUCK_EVACUATION_MAX,
          disabled: submitting || isDistrictOfficer,
          error: KisanValidation.validatePositiveIntegerInBounds(inputs.truckEvacuationCapacity, { max: TRUCK_EVACUATION_MAX, label: 'Trucks for evacuation' }),
          onChange: (v) => updateInput('truckEvacuationCapacity', v),
        })
      ),
      !isDistrictOfficer && h('div', { className: 'actions' },
        h('button', {
          className: 'btn btn-primary', onClick: submitDeclaration,
          disabled: submitting
            || !!KisanValidation.validatePositiveIntegerInBounds(inputs.gunnyBagsAvailable, { max: GUNNY_BAGS_MAX })
            || !!KisanValidation.validatePositiveIntegerInBounds(inputs.hamaliGangCount, { max: HAMALI_GANG_MAX })
            || !!KisanValidation.validatePositiveIntegerInBounds(inputs.truckEvacuationCapacity, { max: TRUCK_EVACUATION_MAX }),
        },
          submitting && h('span', { className: 'spinner' }),
          submitting ? 'Submitting…' : 'Submit declaration'
        )
      )
    ),

    result && h('fieldset', null, h(ResultPanel, { result: result }))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
