<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>District Officer Dashboard</title>
<link rel="stylesheet" href="/theme.css" />
<style>
  body { max-width: 1100px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-8); }
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1.05rem; margin: 0 0 var(--space-3); }
  .sub { color: var(--ink-60); margin: 0 0 var(--space-4); font-size: 0.9rem; }
  .nav { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2) var(--space-3); font-size: 0.85rem; margin-bottom: var(--space-5); }
  .nav a { color: var(--green); font-weight: 600; }
  .date-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-6); }
  .date-row label { font-size: 0.85rem; color: var(--ink-60); margin-bottom: 0; }
  .date-row input[type="date"] { width: auto; min-height: 40px; padding: 0.4rem 0.6rem; font-size: 0.95rem; }
  section { margin-bottom: var(--space-7); }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
  @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); }
  .stat.risk { background: var(--red-bg); border-color: var(--red-border); }
  .stat .n { font-size: 1.6rem; font-weight: 700; }
  .stat .l { font-size: 0.78rem; color: var(--ink-60); }
  tr.at-risk { background: var(--amber-bg); }
  tr.overbooked td:first-child { border-left: 3px solid var(--red); }
  .cover-null { color: var(--ink-30); }
  .cover-low { color: var(--red); font-weight: 700; }
  .alert-card { border: 1px solid var(--amber-border); background: var(--amber-bg); border-radius: var(--radius); padding: var(--space-4); margin-bottom: var(--space-3); }
  .alert-card .head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .alert-card .name { font-weight: 600; }
  .alert-card .reason { font-size: 0.8rem; color: var(--amber-ink); }
  .alert-card .detail { font-size: 0.82rem; color: var(--ink-60); margin-top: var(--space-1); }
  .release-form { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
  .release-form input[type="number"] { width: 6.5rem; min-height: 40px; padding: 0.4rem 0.6rem; }
  .release-ok { display: flex; align-items: center; gap: var(--space-2); color: var(--green-ink); font-size: 0.85rem; font-weight: 600; margin-top: var(--space-2); }
  .bar-bg { background: var(--ink-10); border-radius: 4px; height: 0.5rem; width: 100%; overflow: hidden; }
  .bar-fill { background: var(--red); height: 100%; }
  .bar-fill.ok { background: var(--green); }
  .link-btn { background: none; border: none; color: var(--green); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; font-size: inherit; min-height: auto; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script>
'use strict';
const h = React.createElement;

const CENTRE_TYPE_LABELS = { apmc_mandi: 'APMC Mandi', pacs: 'PACS', ikp: 'IKP' };
const WEIGHING_MODE_LABELS = { weighbridge: 'Weighbridge', platform: 'Platform' };
const CONSTRAINT_LABELS = {
  weighbridge: 'Weighing',
  hamali: 'Hamali gangs',
  gunny: 'Gunny bags',
  truckEvacuation: 'Truck evacuation',
  yardSpace: 'Yard space',
  moistureTesting: 'Moisture testing',
};
const ALERT_REASON_LABELS = {
  overbooked_and_low_bag_cover: 'Overbooked & low bag cover',
  overbooked: 'Overbooked -- no bookable capacity left',
  low_bag_cover: 'Low gunny bag cover',
};
const DEFERRAL_REASON_LABELS = {
  capacity_reduced: 'Capacity reduced since booking',
};
const CHANNEL_LABELS = { sms: 'SMS', ivr: 'IVR (voice)', app: 'App' };

// Formats using the browser's local calendar date -- never toISOString(),
// which converts to UTC and silently shifts the date for any timezone
// ahead of UTC (e.g. IST) during the hours after local midnight but
// before UTC midnight.
function formatLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function today() {
  return formatLocalDate(new Date());
}

function todayPlusOne() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return formatLocalDate(d);
}

function formatDate(value) {
  if (!value) return null;
  const d = new Date(`${value}T00:00:00`);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function formatDateTime(value) {
  if (!value) return null;
  const d = new Date(value);
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

async function fetchJson(url, options) {
  const res = await fetch(url, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error((body && (body.message || (body.errors || []).join(', '))) || `request failed (${res.status})`);
  }
  return body;
}

function StatCard({ value, label, risk }) {
  return h('div', { className: 'stat' + (risk ? ' risk' : '') },
    h('div', { className: 'n num' }, value),
    h('div', { className: 'l' }, label)
  );
}

function coverCell(daysOfCover) {
  if (daysOfCover === null) return h('span', { className: 'cover-null' }, 'no data');
  return h('span', { className: daysOfCover < 1.5 ? 'cover-low' : '' }, `${daysOfCover}d`);
}

// Every tied constraint is still in c.bindingConstraints (and the
// declaration screen's own table shows the full breakdown) -- this is
// just the compact label for a table cell, so beyond two it's summarised
// rather than run on ("Weighing & Hamali gangs and 3 others") instead of
// listing all five and pushing the row off the edge of the table.
function formatBindingLabel(keys) {
  const labels = keys.map((k) => CONSTRAINT_LABELS[k] || k);
  if (labels.length <= 2) return labels.join(' & ');
  return `${labels.slice(0, 2).join(' & ')} and ${labels.length - 2} others`;
}

function CentreGrid({ centres }) {
  if (centres.length === 0) {
    return h('div', { className: 'empty-state' },
      h('span', { className: 'ic' }, '📋'),
      'No centres operating on this date.'
    );
  }
  return h('div', { className: 'table-scroll' },
    h('table', null,
      h('thead', null, h('tr', null,
        h('th', null, 'Centre'), h('th', null, 'Type'), h('th', null, 'Weighing'),
        h('th', null, 'Capacity (lots)'), h('th', null, 'Booked'),
        h('th', null, 'Binding constraint'), h('th', null, 'Gunny cover')
      )),
      h('tbody', null,
        centres.map((c) => {
          const bindingLabel = formatBindingLabel(c.bindingConstraints || [c.bindingConstraint]);
          const rowClasses = [c.atRisk ? 'at-risk' : '', c.overbooked ? 'overbooked' : ''].filter(Boolean).join(' ');
          return h('tr', { key: c.centreId, className: rowClasses },
            h('td', null, `${c.name} (${c.code})`),
            h('td', null, CENTRE_TYPE_LABELS[c.centreType] || c.centreType),
            h('td', null, WEIGHING_MODE_LABELS[c.weighingMode] || c.weighingMode),
            h('td', { className: 'num' }, c.bookableCapacity),
            h('td', { className: 'num' }, `${c.bookedSlots}${c.overbooked ? ' (full)' : ''}`),
            h('td', null, bindingLabel),
            h('td', { className: 'num' }, coverCell(c.daysOfCover))
          );
        })
      )
    )
  );
}

function ReleaseBagsForm({ centreId, date, onReleased }) {
  const [amount, setAmount] = React.useState(500);
  const [submitting, setSubmitting] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [done, setDone] = React.useState(false);

  async function submit() {
    setSubmitting(true);
    setError(null);
    try {
      const body = await fetchJson(`/api/dashboard/centres/${centreId}/release-bags`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, additionalBags: amount }),
      });
      setDone(true);
      onReleased(body);
    } catch (err) {
      setError(err.message);
    } finally {
      setSubmitting(false);
    }
  }

  if (done) {
    return h('div', { className: 'release-ok' }, '✓ Bags released -- capacity recomputed.');
  }

  return h('div', null,
    h('div', { className: 'release-form' },
      h('input', {
        type: 'number', min: 1, value: amount, disabled: submitting,
        'aria-label': 'Additional bags to release',
        onChange: (e) => setAmount(Math.max(1, Number(e.target.value) || 0)),
      }),
      h('span', { style: { fontSize: '0.82rem', color: 'var(--ink-60)' } }, 'bags'),
      h('button', { className: 'btn btn-primary btn-sm', onClick: submit, disabled: submitting },
        submitting && h('span', { className: 'spinner' }),
        submitting ? 'Releasing…' : 'Release bags'
      )
    ),
    error && h('div', { className: 'field-error' }, error)
  );
}

function AlertCard({ alert, date, onReleased }) {
  return h('div', { className: 'alert-card' },
    h('div', { className: 'head' },
      h('div', null,
        h('div', { className: 'name' }, `${alert.name} (${alert.code})`),
        h('div', { className: 'reason' }, ALERT_REASON_LABELS[alert.reason] || alert.reason)
      )
    ),
    h('div', { className: 'detail' },
      alert.daysOfCover === null
        ? 'No recent burn-rate data. '
        : `${alert.daysOfCover} days of gunny bag cover (burn rate ${alert.burnRatePerDay}/day). `,
      alert.overbooked ? `Booked ${alert.bookedSlots} of ${alert.bookableCapacity} bookable slots.` : ''
    ),
    h(ReleaseBagsForm, { centreId: alert.centreId, date, onReleased })
  );
}

function AlertsPanel({ alerts, date, onReleased }) {
  if (alerts.length === 0) {
    return h('div', { className: 'empty-state' },
      h('span', { className: 'ic' }, '✓'),
      'No centres at risk on this date.'
    );
  }
  return h('div', null, alerts.map((a) => h(AlertCard, { key: a.centreId, alert: a, date, onReleased })));
}

function EvacuationBacklog({ rows }) {
  if (rows.length === 0) {
    return h('div', { className: 'empty-state' },
      h('span', { className: 'ic' }, '🚚'),
      'No centres operating on this date.'
    );
  }
  return h('div', { className: 'table-scroll' },
    h('table', null,
      h('thead', null, h('tr', null,
        h('th', null, 'Centre'), h('th', null, 'Undispatched (t)'), h('th', null, 'Yard capacity (t)'), h('th', null, 'Utilisation')
      )),
      h('tbody', null,
        rows.map((r) => h('tr', { key: r.centreId },
          h('td', null, `${r.name} (${r.code})`),
          h('td', { className: 'num' }, r.undispatchedTonnes),
          h('td', { className: 'num' }, r.yardCapacityTonnes),
          h('td', null,
            h('div', { className: 'bar-bg' },
              h('div', {
                className: 'bar-fill' + (r.yardUtilization < 0.75 ? ' ok' : ''),
                style: { width: `${Math.min(100, r.yardUtilization * 100)}%` },
              })
            ),
            h('span', { className: 'num', style: { fontSize: '0.75rem', color: 'var(--ink-60)' } }, `${Math.round(r.yardUtilization * 100)}%`)
          )
        ))
      )
    )
  );
}

// ---------------------------------------------------------------------------
// Nightly reallocation (on-demand run + result)
// ---------------------------------------------------------------------------

function AlternativeOffer({ alternative }) {
  if (!alternative) return h('span', { style: { color: 'var(--ink-30)' } }, '—');
  const { nextDateAtThisCentre, nearbyCentres } = alternative;
  const parts = [];
  if (nextDateAtThisCentre) {
    parts.push(`Same centre, ${formatDate(nextDateAtThisCentre.date)} (${nextDateAtThisCentre.remainingSlots} slots)`);
  }
  if (nearbyCentres && nearbyCentres.length > 0) {
    const nearest = nearbyCentres[0];
    parts.push(`${nearest.name} (${nearest.distanceKm} km, ${nearest.remainingSlots} slots)`);
  }
  if (parts.length === 0) {
    return h('span', { style: { color: 'var(--red)', fontSize: '0.82rem' } }, 'No alternative found nearby');
  }
  return h('div', null, parts.map((p, i) => h('div', { key: i, style: { fontSize: '0.82rem' } }, p)));
}

function DeferralsTable({ deferrals }) {
  if (deferrals.length === 0) {
    return h('div', { className: 'empty-state' }, h('span', { className: 'ic' }, '✓'), 'No bookings needed to be deferred.');
  }
  return h('div', { className: 'table-scroll' },
    h('table', null,
      h('thead', null, h('tr', null,
        h('th', null, 'Farmer'), h('th', null, 'Centre'), h('th', null, 'Date'),
        h('th', null, 'Score'), h('th', null, 'Reason'), h('th', null, 'Alternative offered')
      )),
      h('tbody', null,
        deferrals.map((d) => h('tr', { key: d.bookingId },
          h('td', null,
            d.farmerName || '(unknown)',
            d.farmerPhone && h('div', { style: { fontSize: '0.75rem', color: 'var(--ink-60)' } }, d.farmerPhone)
          ),
          h('td', null, `${d.centreName || '—'}${d.centreCode ? ` (${d.centreCode})` : ''}`),
          h('td', null, formatDate(d.date)),
          h('td', { className: 'num' }, d.score),
          h('td', null, h('span', { className: 'badge badge-warning' }, DEFERRAL_REASON_LABELS[d.reason] || d.reason)),
          h('td', null, h(AlternativeOffer, { alternative: d.alternative }))
        ))
      )
    )
  );
}

function NoShowTable({ rows }) {
  if (rows.length === 0) {
    return h('div', { className: 'empty-state' }, h('span', { className: 'ic' }, '🚪'), "No no-shows to release for this run's date.");
  }
  return h('div', { className: 'table-scroll' },
    h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Farmer'), h('th', null, 'Centre'), h('th', null, 'Bags released'))),
      h('tbody', null,
        rows.map((r) => h('tr', { key: r.bookingId },
          h('td', null, r.farmerName || '(unknown)'),
          h('td', null, `${r.centreName || '—'}${r.centreCode ? ` (${r.centreCode})` : ''}`),
          h('td', { className: 'num' }, r.bagsReleased)
        ))
      )
    )
  );
}

function RecomputedCapacityTable({ rows }) {
  if (rows.length === 0) {
    return h('div', { className: 'empty-state' }, h('span', { className: 'ic' }, '📋'), 'No centres had declared inputs to recompute.');
  }
  return h('div', { className: 'table-scroll' },
    h('table', null,
      h('thead', null, h('tr', null,
        h('th', null, 'Centre'), h('th', null, 'Date'), h('th', null, 'Total capacity'),
        h('th', null, 'Bookable'), h('th', null, 'Binding constraint')
      )),
      h('tbody', null,
        rows.map((u, i) => h('tr', { key: i },
          h('td', null, `${u.centreName || '—'}${u.centreCode ? ` (${u.centreCode})` : ''}`),
          h('td', null, formatDate(u.date)),
          h('td', { className: 'num' }, u.totalCapacity),
          h('td', { className: 'num' }, u.bookableCapacity),
          h('td', null, CONSTRAINT_LABELS[u.bindingConstraint] || u.bindingConstraint)
        ))
      )
    )
  );
}

// The on-demand equivalent of the cron-triggered nightly job (see
// reallocationCli.js) -- otherwise there was no way to actually show this,
// the project's core demonstration, without waiting for a real night to
// pass. `date` plays the role of "today" in the job itself: its no-shows
// are released, and D+1..D+7 are recomputed and, wherever now over
// capacity, reallocated.
function ReallocationPanel({ onApplied }) {
  const [date, setDate] = React.useState(today());
  const [running, setRunning] = React.useState(false);
  const [result, setResult] = React.useState(null);
  const [error, setError] = React.useState(null);

  async function run() {
    setRunning(true);
    setError(null);
    try {
      const body = await fetchJson('/api/admin/run-reallocation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date }),
      });
      setResult(body);
      onApplied(); // the run just changed real capacity/booking state -- refresh the views built on it
    } catch (err) {
      setError(err.message);
    } finally {
      setRunning(false);
    }
  }

  return h('div', null,
    h('p', { style: { fontSize: '0.85rem', color: 'var(--ink-60)', marginTop: 0, marginBottom: 'var(--space-4)' } },
      "Runs the same job a nightly cron trigger runs automatically -- releases this date's no-shows, recomputes capacity for the following 7 days, and defers the lowest-priority bookings wherever demand now exceeds it. Safe to re-run: an already-released no-show or already-deferred booking is left alone."
    ),
    h('div', { className: 'date-row', style: { marginBottom: 0 } },
      h('label', null, 'Run as of'),
      h('input', { type: 'date', value: date, max: today(), onChange: (e) => setDate(e.target.value) }),
      h('button', { className: 'btn btn-primary btn-sm', onClick: run, disabled: running },
        running && h('span', { className: 'spinner' }),
        running ? 'Running…' : 'Run nightly reallocation'
      )
    ),

    error && h('div', { className: 'callout callout-danger', style: { marginTop: 'var(--space-4)' } }, error),

    result && h('div', { style: { marginTop: 'var(--space-5)' } },
      h('div', { className: 'stat-grid', style: { marginBottom: 'var(--space-5)' } },
        h(StatCard, { value: result.centreDayUpserts.length, label: 'Centre-days recomputed' }),
        h(StatCard, { value: result.noShowReleases.length, label: 'No-shows released' }),
        h(StatCard, { value: result.deferrals.length, label: 'Bookings deferred', risk: result.deferrals.length > 0 }),
        h(StatCard, { value: result.notifications.length, label: 'Notifications queued' })
      ),

      h('h3', { style: { fontSize: '0.92rem', margin: '0 0 var(--space-2)' } }, 'Deferred bookings -- who, why, and their alternative'),
      h(DeferralsTable, { deferrals: result.deferrals }),

      h('h3', { style: { fontSize: '0.92rem', margin: 'var(--space-5) 0 var(--space-2)' } }, 'No-shows released'),
      h(NoShowTable, { rows: result.noShowReleases }),

      h('h3', { style: { fontSize: '0.92rem', margin: 'var(--space-5) 0 var(--space-2)' } }, 'Recomputed capacity (D+1 .. D+7)'),
      h(RecomputedCapacityTable, { rows: result.centreDayUpserts }),

      result.ewmaUpdates.length > 0 && h('div', null,
        h('h3', { style: { fontSize: '0.92rem', margin: 'var(--space-5) 0 var(--space-2)' } }, "Service-time updates (today's completed lots)"),
        h('ul', { style: { margin: 0, paddingLeft: '1.1rem', fontSize: '0.85rem' } },
          result.ewmaUpdates.map((e, i) => h('li', { key: i, style: { marginBottom: 'var(--space-1)' } },
            `${e.centreName || '—'}${e.centreCode ? ` (${e.centreCode})` : ''}: ${e.newEwmaMinutes} min/lot`
          ))
        )
      )
    )
  );
}

// ---------------------------------------------------------------------------
// Messages (queued notifications)
// ---------------------------------------------------------------------------

function MessagesPanel({ messages, loading, error, onRefresh }) {
  return h('div', null,
    h('div', { style: { display: 'flex', justifyContent: 'flex-end', marginBottom: 'var(--space-3)' } },
      h('button', { className: 'btn btn-secondary btn-sm', onClick: onRefresh, disabled: loading },
        loading && h('span', { className: 'spinner' }),
        loading ? 'Loading…' : 'Refresh'
      )
    ),
    error && h('div', { className: 'callout callout-danger', style: { marginBottom: 'var(--space-4)' } }, error),
    loading && !messages && h('div', { className: 'loading-row' }, h('span', { className: 'spinner' }), 'Loading messages…'),
    messages && messages.length === 0 && h('div', { className: 'empty-state' },
      h('span', { className: 'ic' }, '📭'), 'No messages queued yet.'
    ),
    messages && messages.length > 0 && h('div', { className: 'table-scroll' },
      h('table', null,
        h('thead', null, h('tr', null,
          h('th', null, 'Farmer'), h('th', null, 'Channel'), h('th', null, 'Message'), h('th', null, 'Status'), h('th', null, 'Queued at')
        )),
        h('tbody', null,
          messages.map((m) => h('tr', { key: m.id },
            h('td', null, m.farmerName || m.mobile || '—'),
            h('td', null, h('span', { className: 'badge badge-neutral' }, CHANNEL_LABELS[m.channel] || m.channel)),
            h('td', null, m.body),
            h('td', null, m.status),
            h('td', null, formatDateTime(m.createdAt))
          ))
        )
      )
    )
  );
}

function App() {
  const [session, setSession] = React.useState({ loading: true, name: null });
  const [date, setDate] = React.useState(todayPlusOne());
  const [dashboard, setDashboard] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [messages, setMessages] = React.useState(null);
  const [messagesLoading, setMessagesLoading] = React.useState(false);
  const [messagesError, setMessagesError] = React.useState(null);

  // District-wide view -- district_officer only. Anyone else (or anyone
  // not logged in) is sent to the shared login screen.
  React.useEffect(() => {
    fetch('/api/auth/me')
      .then((res) => res.ok ? res.json() : Promise.reject())
      .then((me) => {
        if (me.role !== 'district_officer') return Promise.reject();
        setSession({ loading: false, name: me.name });
      })
      .catch(() => { window.location.href = '/login.html'; });
  }, []);

  const load = React.useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const body = await fetchJson(`/api/dashboard?date=${date}`);
      setDashboard(body);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }, [date]);

  React.useEffect(() => { if (!session.loading) load(); }, [load, session.loading]);

  const loadMessages = React.useCallback(async () => {
    setMessagesLoading(true);
    setMessagesError(null);
    try {
      const body = await fetchJson('/api/admin/messages');
      setMessages(body.messages);
    } catch (err) {
      setMessagesError(err.message);
    } finally {
      setMessagesLoading(false);
    }
  }, []);

  React.useEffect(() => { if (!session.loading) loadMessages(); }, [loadMessages, session.loading]);

  // A reallocation run changes real capacity/booking state (and queues new
  // notifications) -- refresh both views built on it rather than leaving
  // them showing what was true before the run.
  const onReallocationApplied = React.useCallback(() => { load(); loadMessages(); }, [load, loadMessages]);

  async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
    window.location.href = '/login.html';
  }

  if (session.loading) {
    return h('div', { className: 'loading-row' }, h('span', { className: 'spinner' }), 'Checking your session…');
  }

  const summary = dashboard && dashboard.summary;

  return h('div', null,
    h('h1', null, 'District Officer Dashboard'),
    h('p', { className: 'sub' }, "Live view of tomorrow's declared centres, bookings, and bag stock risk."),
    // No link to the farmer screen -- this page is district_officer-only,
    // and a district officer can never use the farmer-only screen.
    h('div', { className: 'nav' },
      h('a', { href: '/declaration.html' }, "← Tonight's Declaration"),
      ' · ',
      h('span', { style: { color: 'var(--ink-60)' } }, `Logged in as ${session.name}`),
      ' · ',
      h('button', { className: 'link-btn', onClick: logout }, 'Log out')
    ),

    h('div', { className: 'date-row' },
      h('label', null, 'Date'),
      h('input', { type: 'date', value: date, onChange: (e) => setDate(e.target.value) }),
      h('button', { className: 'btn btn-secondary btn-sm', onClick: load, disabled: loading },
        loading && h('span', { className: 'spinner' }),
        loading ? 'Loading…' : 'Refresh'
      )
    ),

    error && h('div', { className: 'callout callout-danger', style: { marginBottom: 'var(--space-4)' } }, error),

    loading && !dashboard && h('div', { className: 'loading-row' }, h('span', { className: 'spinner' }), 'Loading district dashboard…'),

    summary && h('section', null,
      h('div', { className: 'stat-grid' },
        h(StatCard, { value: summary.centresOperating, label: 'Centres operating' }),
        h(StatCard, { value: summary.totalDistrictCapacity, label: 'Total district capacity (lots/day)' }),
        h(StatCard, { value: summary.bookingsForDate, label: 'Bookings this date' }),
        h(StatCard, { value: summary.centresAtRisk, label: 'Centres at risk', risk: summary.centresAtRisk > 0 })
      )
    ),

    dashboard && h('section', null,
      h('h2', null, 'Centres'),
      h(CentreGrid, { centres: dashboard.centres })
    ),

    dashboard && h('section', null,
      h('h2', null, 'At-risk alerts'),
      h(AlertsPanel, { alerts: dashboard.alerts, date, onReleased: load })
    ),

    dashboard && h('section', null,
      h('h2', null, 'Evacuation backlog'),
      h(EvacuationBacklog, { rows: dashboard.evacuationBacklog })
    ),

    h('section', null,
      h('h2', null, 'Run nightly reallocation'),
      h(ReallocationPanel, { onApplied: onReallocationApplied })
    ),

    h('section', null,
      h('h2', null, 'Messages'),
      h(MessagesPanel, { messages, loading: messagesLoading, error: messagesError, onRefresh: loadMessages })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
