<!-- Linked before the Tailwind CDN script so Tailwind's generated rules
     (equal-or-higher specificity, later in the cascade) win any
     property tie -- this page keeps its existing Tailwind utility
     styling untouched and only gains theme.css's named component
     classes (.badge, .callout, .spinner, .field-error, .empty-state)
     that nothing here already defines, plus the shared tabular-nums
     base rule. -->
<link rel="stylesheet" href="/theme.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        // Names namespaced under "kisan" so they never collide with
        // Tailwind's own default green/red scales -- this is the same
        // palette as theme.css's :root tokens (shared with declaration
        // and dashboard), duplicated as literal hex here because
        // Tailwind's colour-opacity modifiers (bg-kisan-green/10 etc.,
        // used throughout this file) need to decompose the colour into
        // RGB channels at build time -- a var(--x) reference can't do
        // that with the CDN's runtime JIT compiler. Keep both in sync.
        colors: {
          kisan: {
            ink: '#16241C',
            paper: '#EDF0EC',
            paperRaised: '#FFFFFF',
            line: '#D3DBD4',
            gold: '#B8891B',
            green: '#2E7D4F',
            amber: '#C6761A',
            red: '#A32B21',
          },
        },
        fontFamily: {
          sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Noto Sans', 'sans-serif'],
        },
      },
    },
  };
</script>

function interpolate(str, vars) {
  if (!vars) return str;
  return Object.keys(vars).reduce((acc, k) => acc.split(`{${k}}`).join(vars[k]), str);
}

function translate(lang, key, vars) {
  const dict = TRANSLATIONS[lang] || TRANSLATIONS.en;
  const raw = dict[key] !== undefined ? dict[key] : (TRANSLATIONS.en[key] !== undefined ? TRANSLATIONS.en[key] : key);
  return interpolate(raw, vars);
}

const LangContext = createContext('en');

function useT() {
  const lang = useContext(LangContext);
  return useMemo(() => (key, vars) => translate(lang, key, vars), [lang]);
}

function useLang() {
  return useContext(LangContext);
}

// Centres carry a transliterated name per language (nameHi/nameTe) so a
// Hindi or Telugu reader can identify their own centre -- falls back to
// the English name for a language with no field, or a centre object that
// hasn't loaded one yet (e.g. an older cached response).
function centreDisplayName(centre, lang) {
  if (!centre) return '';
  if (lang === 'hi' && centre.nameHi) return centre.nameHi;
  if (lang === 'te' && centre.nameTe) return centre.nameTe;
  return centre.name;
}

// Persisted via the URL's ?lang= query param rather than any client-side
// storage -- a reload of the same link keeps the chosen language without
// writing anything to the browser on the farmer's behalf.
function getInitialLang() {
  try {
    const lang = new URLSearchParams(window.location.search).get('lang');
    return TRANSLATIONS[lang] ? lang : 'en';
  } catch (err) {
    return 'en';
  }
}

function persistLang(lang) {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.history.replaceState({}, '', url);
  } catch (err) {
    // Non-fatal -- the selector still works for the rest of this visit.
  }
}

// Never throws on an HTTP-level response -- 404 (nothing on file yet) and
// 400 (validation) are normal, expected outcomes on this screen, not
// exceptions. Only a network failure or unparsable body throws.
async function fetchJson(url, options) {
  const res = await fetch(url, options);
  const body = await res.json().catch(() => ({}));
  return { httpStatus: res.status, body };
}

// Formats using the browser's local calendar date -- never toISOString(),
// which converts to UTC and silently shifts the date for any timezone
// ahead of UTC (e.g. IST) during the hours after local midnight but
// before UTC midnight.
function formatLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function today() {
  return formatLocalDate(new Date());
}

function todayPlusOne() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return formatLocalDate(d);
}

function maxBookingDate() {
  const d = new Date();
  d.setDate(d.getDate() + KisanValidation.BOOKING_MAX_DAYS_AHEAD);
  return formatLocalDate(d);
}

function formatINR(value) {
  if (value === null || value === undefined) return '—';
  return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(value);
}

function formatDate(value) {
  if (!value) return null;
  const d = new Date(`${value}T00:00:00`);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function formatDateTime(value) {
  if (!value) return null;
  const d = new Date(value);
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

// Weather advisory (Open-Meteo, no key) -- advisory only, never blocks
// booking, and fails silently if unreachable or the date is outside the
// forecast horizon.
// ---------------------------------------------------------------------------

function useRainForecast(centre, date) {
  const [probability, setProbability] = useState(null);

  useEffect(() => {
    let cancelled = false;
    setProbability(null);
    if (!centre || !date || centre.latitude == null || centre.longitude == null) return undefined;

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${centre.latitude}&longitude=${centre.longitude}` +
      `&daily=precipitation_probability_max&timezone=Asia%2FKolkata&start_date=${date}&end_date=${date}`;

    fetch(url)
      .then((res) => (res.ok ? res.json() : null))
      .then((data) => {
        if (cancelled || !data || !data.daily) return;
        const values = data.daily.precipitation_probability_max;
        if (Array.isArray(values) && typeof values[0] === 'number') {
          setProbability(values[0]);
        }
      })
      .catch(() => {}); // unreachable/blocked network -- silently skip the advisory

    return () => { cancelled = true; };
  }, [centre && centre.id, date]);

  return probability;
}

function RainWarning({ centre, date }) {
  const t = useT();
  const probability = useRainForecast(centre, date);
  if (probability === null || probability <= 40) return null;

  return h('div', { className: 'mb-4' },
    h(Callout, { tone: 'warning', icon: 'fa-cloud-rain' },
      h('p', { className: 'font-bold mb-1' }, t('weatherWarningTitle')),
      h('p', { className: 'text-sm m-0' }, t('weatherWarningBody', { pct: Math.round(probability) }))
    )
  );
}

// Server-returned validation strings (the rare case the server rejects
// something the client-side check let through) mapped back to the field
// they're about, so they render inline under that field instead of in a
// banner. Anything that doesn't match a known field falls into
// `general`, still shown -- never dropped silently.
const BOOKING_FIELD_ERROR_PATTERNS = [
  { test: /quintals|quantity/i, field: 'quintals' },
  { test: /\bdate\b/i, field: 'date' },
  { test: /centreId|centre/i, field: 'centre' },
];
function classifyBookingErrors(errors) {
  const byField = { quintals: [], date: [], centre: [], general: [] };
  for (const e of errors || []) {
    const match = BOOKING_FIELD_ERROR_PATTERNS.find((p) => p.test.test(e));
    (match ? byField[match.field] : byField.general).push(e);
  }
  return byField;
}

function BookScreen({ farmer, onSwitchTab }) {
  const t = useT();
  const lang = useLang();
  const [quintals, setQuintals] = useState('');
  const [centreId, setCentreId] = useState('');
  const [date, setDate] = useState(todayPlusOne());
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null); // { httpStatus, body }
  const [networkError, setNetworkError] = useState(null);
  // Validation errors that stay on the booking form (inline under the
  // field, never a banner that replaces it) -- distinct from `result`,
  // which is for outcomes that replace the form with their own screen
  // (booked, needs review, no capacity, already booked, ...).
  const [serverErrors, setServerErrors] = useState(null); // string[] | null

  // Refetched per selected date, not just once on mount -- a centre with
  // nothing declared (or nothing left) for one date may well have room on
  // another, so the pick list has to track the date field, not just the
  // farmer's session. `null` means "still loading this date's list";
  // `[]` means the load finished and came back empty for real -- these
  // render differently below (a spinner vs. an explained empty state).
  const [dateCentres, setDateCentres] = useState(null);

  useEffect(() => {
    let cancelled = false;
    setDateCentres(null);
    if (!date) return undefined;
    fetchJson(`/api/centres?date=${encodeURIComponent(date)}`)
      .then(({ httpStatus, body }) => {
        if (cancelled) return;
        setDateCentres(httpStatus === 200 && Array.isArray(body) ? body : []);
      })
      .catch(() => { if (!cancelled) setDateCentres([]); });
    return () => { cancelled = true; };
  }, [date]);

  // Only centres with at least one bookable slot left for this date --
  // everything else would just 200 back NO_CAPACITY on submit, which is
  // handled fine (see below) but there's no reason to offer a pick that's
  // guaranteed to fail when the server already told us which ones aren't.
  const availableCentres = useMemo(
    () => (dateCentres || []).filter((c) => (c.remaining || 0) > 0),
    [dateCentres]
  );

  // Keeps the selection valid as the date (and so the available list)
  // changes -- drops to the first still-available centre, or to nothing
  // if none are left, rather than silently submitting a stale centreId
  // that's no longer in the list the farmer can see.
  useEffect(() => {
    if (dateCentres === null) return; // still loading -- don't thrash the selection yet
    if (!availableCentres.some((c) => c.id === centreId)) {
      setCentreId(availableCentres[0] ? availableCentres[0].id : '');
    }
  }, [availableCentres]); // eslint-disable-line react-hooks/exhaustive-deps

  const selectedCentre = useMemo(() => availableCentres.find((c) => c.id === centreId) || null, [availableCentres, centreId]);

  // Field-level errors -- computed on every keystroke so a bad value is
  // flagged where it's typed, not only after the farmer hits "Book slot".
  const quintalsError = useMemo(
    () => (quintals === '' ? null : KisanValidation.validateQuantity(quintals, farmer.permittedQuantityQuintals)),
    [quintals, farmer.permittedQuantityQuintals]
  );
  const dateError = useMemo(() => KisanValidation.validateBookingDate(date, today()), [date]);

  async function submit(overrides = {}) {
    const payload = {
      farmerId: farmer.id,
      quintals: Number(overrides.quintals !== undefined ? overrides.quintals : quintals),
      centreId: overrides.centreId || centreId,
      date: overrides.date || date,
    };
    const quantityErr = KisanValidation.validateQuantity(payload.quintals, farmer.permittedQuantityQuintals);
    const dateErr = KisanValidation.validateBookingDate(payload.date, today());
    if (quantityErr || dateErr || !payload.centreId) {
      setResult(null);
      setServerErrors([quantityErr, dateErr, !payload.centreId ? t('enterAllFields') : null].filter(Boolean));
      return;
    }
    setSubmitting(true);
    setNetworkError(null);
    setServerErrors(null);
    try {
      const res = await fetchJson('/api/bookings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      // A validation failure the server caught (the client-side check
      // above should already prevent most of these) stays on the form,
      // rendered field-by-field -- every other outcome (booked, already
      // booked, needs review, no capacity, not found, or anything else)
      // replaces the form with its own screen below.
      if (res.body && res.body.status === 'BAD_REQUEST') {
        setResult(null);
        setServerErrors(res.body.errors && res.body.errors.length ? res.body.errors : [res.body.message || t('somethingWrong')]);
      } else {
        setResult(res);
      }
      if (overrides.centreId) setCentreId(overrides.centreId);
      if (overrides.date) setDate(overrides.date);
    } catch (err) {
      setNetworkError(err.message);
    } finally {
      setSubmitting(false);
    }
  }

  function reset() {
    setResult(null);
    setServerErrors(null);
  }

  const status = result && result.body && result.body.status;
  const serverErrorsByField = useMemo(() => classifyBookingErrors(serverErrors), [serverErrors]);

  if (status === 'BOOKED') {
    const b = result.body.booking;
    return h('div', null,
      h(Callout, { tone: 'success' },
        h('div', { className: 'flex justify-center mb-3' }, h(Badge, { tone: 'success' },
          h('i', { className: 'fa-solid fa-circle-check' }), t('bookedBadge')
        )),
        h(QRTicket, { booking: b, farmer }),
        h('div', { className: 'mt-3' },
          h(Card, null,
            h(Row, { k: t('rowQuantity'), v: `${b.quintals} ${t('unitQuintal')}` }),
            h(Row, { k: t('rowDate'), v: formatDate(b.date) }),
            h(Row, { k: t('rowSlotsLeft'), v: result.body.remainingSlots })
          )
        ),
        h('p', { className: 'text-sm text-kisan-ink/60 flex items-center gap-2 mt-3' },
          h('i', { className: 'fa-solid fa-circle-info' }), t('bringTokenNote')
        )
      ),
      h('div', { className: 'flex gap-2.5 mt-4' },
        h(PrimaryButton, { onClick: () => onSwitchTab('status'), icon: 'fa-route' }, t('seeStatusBtn')),
        h(SecondaryButton, { onClick: reset }, t('bookAnotherBtn'))
      )
    );
  }

  if (status === 'NEEDS_OFFICER_REVIEW') {
    return h('div', null,
      h(Callout, { tone: 'warning', icon: 'fa-user-clock' },
        h('div', { className: 'inline-block mb-2' }, h(Badge, { tone: 'warning' }, t('needsReviewBadge'))),
        h('p', { className: 'font-bold mb-1' }, result.body.message),
        result.body.landEstimateQuintals !== undefined && h('p', { className: 'text-sm text-kisan-ink/60 mb-1' },
          t('landEstimateNote', { est: result.body.landEstimateQuintals, req: result.body.requestedQuintals })
        ),
        h('p', { className: 'text-sm text-kisan-ink/60 m-0' }, t('reviewNoteShort'))
      ),
      h('div', { className: 'mt-3' }, h(SecondaryButton, { onClick: reset }, t('tryDifferentQtyBtn')))
    );
  }

  if (status === 'NO_CAPACITY') {
    const alt = result.body.alternatives || {};
    return h('div', null,
      h('div', { className: 'mb-4' },
        h(Callout, { tone: 'warning', icon: 'fa-triangle-exclamation' },
          h('p', { className: 'font-bold mb-1' }, t('dontLoadTitle')),
          h('p', { className: 'text-sm m-0' }, t('noCapacityNote'))
        )
      ),
      alt.nextDateAtThisCentre && h(AlternativeCard, {
        title: t('sameCentreTitle', { date: formatDate(alt.nextDateAtThisCentre.date) }),
        detail: t('slotsOpen', { n: alt.nextDateAtThisCentre.remainingSlots }),
        onBook: () => submit({ date: alt.nextDateAtThisCentre.date }),
      }),
      (alt.nearbyCentres || []).map((c) => h(AlternativeCard, {
        key: c.centreId,
        title: t('kmAway', { name: centreDisplayName(c, lang), km: c.distanceKm }),
        detail: t('slotsOpenToday', { n: c.remainingSlots }),
        onBook: () => submit({ centreId: c.centreId }),
      })),
      (!alt.nextDateAtThisCentre && (alt.nearbyCentres || []).length === 0) &&
        h('p', { className: 'text-center text-sm text-kisan-ink/60 py-4' }, t('noAlternativesNote')),
      h('div', { className: 'mt-2' }, h(SecondaryButton, { onClick: reset }, t('backBtn')))
    );
  }

  if (status === 'ALREADY_BOOKED') {
    return h('div', null,
      h(Callout, { tone: 'danger', icon: 'fa-calendar-xmark' },
        h('p', { className: 'font-bold m-0' }, t('alreadyBookedMessage'))
      ),
      h('div', { className: 'mt-3' },
        h(PrimaryButton, { onClick: () => onSwitchTab('status'), icon: 'fa-route' }, t('seeStatusBtn'))
      )
    );
  }

  // Catch-all: anything else the server sent back (an unknown farmer/
  // centre, a raw 500 from the global error handler, or any status this
  // screen doesn't have a dedicated view for) still gets a plain message
  // -- never silence, matching every other branch above.
  if (status) {
    const message = result.body.message || (result.body.errors || []).join(', ') || t('somethingWrong');
    return h('div', null,
      h(Callout, { tone: 'danger', icon: 'fa-circle-exclamation' }, h('p', { className: 'font-bold m-0' }, message)),
      h('div', { className: 'mt-3' }, h(SecondaryButton, { onClick: reset }, t('tryAgainBtn')))
    );
  }

  return h('div', null,
    networkError && h('div', { className: 'mb-4' }, h(Callout, { tone: 'danger', icon: 'fa-circle-exclamation' }, networkError)),
    h(Card, { className: '!p-4' },
      h('div', { className: 'mb-4' },
        h(FieldLabel, { icon: 'fa-weight-hanging' }, t('fieldQuantity')),
        h('input', {
          type: 'number', min: 0, max: KisanValidation.ABSOLUTE_QUANTITY_CAP_QUINTALS, step: '0.1', value: quintals, placeholder: t('quantityPlaceholder'),
          className: inputClass + (quintalsError || serverErrorsByField.quintals.length ? ' border-kisan-red' : ''), onChange: (e) => setQuintals(e.target.value),
        }),
        quintalsError && h('p', { className: 'field-error' }, quintalsError),
        !quintalsError && serverErrorsByField.quintals.map((e, i) => h('p', { key: i, className: 'field-error' }, e))
      ),
      h('div', { className: 'mb-4' },
        h(FieldLabel, { icon: 'fa-warehouse' }, t('fieldCentre')),
        dateCentres === null
          ? h('p', { className: 'text-sm text-kisan-ink/60 flex items-center gap-2 py-2' },
              h('i', { className: 'fa-solid fa-circle-notch fa-spin' }), t('loadingEllipsis')
            )
          : dateCentres.length === 0
          ? h('div', { className: 'empty-state' }, h('span', { className: 'ic' }, '🏚️'), t('noCentresNote'))
          : availableCentres.length === 0
          ? h('div', { className: 'empty-state' }, h('span', { className: 'ic' }, '🗓️'), t('noCentresCapacityNote'))
          : h('select', {
              value: centreId, className: inputClass + (serverErrorsByField.centre.length ? ' border-kisan-red' : ''),
              onChange: (e) => setCentreId(e.target.value),
            },
              availableCentres.map((c) => h('option', { key: c.id, value: c.id }, `${centreDisplayName(c, lang)} (${c.code})`))
            ),
        serverErrorsByField.centre.map((e, i) => h('p', { key: i, className: 'field-error' }, e))
      ),
      h('div', null,
        h(FieldLabel, { icon: 'fa-calendar-day' }, t('fieldDate')),
        h('input', {
          type: 'date', value: date, min: today(), max: maxBookingDate(),
          className: inputClass + (dateError || serverErrorsByField.date.length ? ' border-kisan-red' : ''), onChange: (e) => setDate(e.target.value),
        }),
        h('p', { className: 'text-xs text-kisan-ink/50 mt-1.5 mb-0' }, t('bookingWindowNote', { n: KisanValidation.BOOKING_MAX_DAYS_AHEAD })),
        dateError && h('p', { className: 'field-error' }, dateError),
        !dateError && serverErrorsByField.date.map((e, i) => h('p', { key: i, className: 'field-error' }, e))
      )
    ),
    serverErrorsByField.general.length > 0 && h('div', { className: 'mt-3' },
      h(Callout, { tone: 'danger', icon: 'fa-circle-exclamation' },
        serverErrorsByField.general.map((e, i) => h('p', { key: i, className: 'm-0' }, e))
      )
    ),
    h(RainWarning, { centre: selectedCentre, date }),
    h(PrimaryButton, {
      onClick: () => submit(), disabled: submitting || !centreId || !quintals || !!quintalsError || !!dateError, icon: 'fa-check-circle',
    }, submitting ? t('bookingEllipsis') : t('bookButton'))
  );
}

function StatusScreen({ farmer, onSwitchTab }) {
  const t = useT();
  const lang = useLang();
  const [state, setState] = useState({ loading: true, data: null, notFound: false, error: null });

  useEffect(() => {
    let cancelled = false;
    setState({ loading: true, data: null, notFound: false, error: null });
    fetchJson(`/api/farmers/${farmer.id}/status`)
      .then(({ httpStatus, body }) => {
        if (cancelled) return;
        if (httpStatus === 404) return setState({ loading: false, data: null, notFound: true, error: null });
        if (httpStatus !== 200) return setState({ loading: false, data: null, notFound: false, error: body.message || t('couldNotLoadStatus') });
        setState({ loading: false, data: body, notFound: false, error: null });
      })
      .catch((err) => !cancelled && setState({ loading: false, data: null, notFound: false, error: err.message }));
    return () => { cancelled = true; };
  }, [farmer.id]);

  if (state.loading) {
    return h('p', { className: 'text-sm text-kisan-ink/60 py-2 flex items-center gap-2' },
      h('i', { className: 'fa-solid fa-circle-notch fa-spin' }), t('loadingStatus')
    );
  }
  if (state.error) return h(Callout, { tone: 'danger', icon: 'fa-circle-exclamation' }, state.error);
  if (state.notFound) {
    return h('div', null,
      h('p', { className: 'text-center text-sm text-kisan-ink/60 py-5' }, t('noBookingsYet')),
      h(PrimaryButton, { onClick: () => onSwitchTab('book'), icon: 'fa-calendar-check' }, t('bookSlotBtn'))
    );
  }

  const { booking, stages, moisture } = state.data;
  // Same "active" definition the server itself uses to block a second
  // booking on the same date (see bookingService.hasActiveBookingOnDate)
  // -- once checked in at the gate the token has already done its job,
  // but a farmer who booked today and is coming back tomorrow needs to
  // be able to pull it back up here, not just on the confirmation screen
  // they saw once at booking time.
  const isActiveBooking = ACTIVE_BOOKING_STATUSES.includes(booking.status);
  return h('div', null,
    isActiveBooking && h('div', { className: 'mb-4' }, h(QRTicket, { booking, farmer })),
    h(Card, null,
      h(Row, {
        k: t('rowCentre'),
        v: `${centreDisplayName({ name: booking.centreName, nameHi: booking.centreNameHi, nameTe: booking.centreNameTe }, lang)} (${booking.centreCode})`,
      }),
      h(Row, { k: t('rowDate'), v: formatDate(booking.serviceDate) }),
      h(Row, { k: t('rowQuantity'), v: `${booking.declaredQuantityQuintals} ${t('unitQuintal')}` })
    ),
    h(SectionHeading, { icon: 'fa-route' }, t('sectionProgress')),
    h(Card, null, h(Timeline, { stages })),
    h(SectionHeading, { icon: 'fa-droplet' }, t('sectionMoisture')),
    h(MoistureCard, { moisture })
  );
}

// Resolves who's logged in from the session cookie (never a client-side
// picker) and redirects to the shared login screen if there's no farmer
// session -- this page no longer lets anyone browse another farmer's
// data by picking a name from a list; the server enforces that too, but
// the UI shouldn't dangle an option that only ever 403s.
function useFarmerSession() {
  const [state, setState] = useState({ loading: true, farmerId: null });

  useEffect(() => {
    let cancelled = false;
    fetchJson('/api/auth/me')
      .then(({ httpStatus, body }) => {
        if (cancelled) return;
        if (httpStatus !== 200 || body.role !== 'farmer') {
          window.location.href = '/login.html';
          return;
        }
        setState({ loading: false, farmerId: body.farmerId });
      })
      .catch(() => { if (!cancelled) window.location.href = '/login.html'; });
    return () => { cancelled = true; };
  }, []);

  return state;
}

async function logout() {
  await fetchJson('/api/auth/logout', { method: 'POST' }).catch(() => {});
  window.location.href = '/login.html';
}

function AppBody() {
  const t = useT();
  const session = useFarmerSession();
  const [farmer, setFarmer] = useState(null);
  const [farmerLoading, setFarmerLoading] = useState(false);
  const [tab, setTab] = useState('book');
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!session.farmerId) return;
    setFarmerLoading(true);
    fetchJson(`/api/farmers/${session.farmerId}`)
      .then(({ httpStatus, body }) => {
        if (httpStatus === 200) setFarmer(body);
        else setError(body.message || t('couldNotLoadFarmer'));
      })
      .catch((err) => setError(err.message))
      .finally(() => setFarmerLoading(false));
  }, [session.farmerId]); // eslint-disable-line react-hooks/exhaustive-deps

  const tabs = [
    { key: 'book', label: t('tabBook'), icon: 'fa-calendar-check' },
    { key: 'status', label: t('tabStatus'), icon: 'fa-route' },

  if (session.loading) {
    return h('div', { className: 'max-w-md mx-auto px-4 py-8' },
      h('p', { className: 'text-sm text-kisan-ink/60 flex items-center gap-2' },
        h('i', { className: 'fa-solid fa-circle-notch fa-spin' }), t('checkingSession')

  return h('div', { className: 'max-w-md mx-auto px-4 pb-16' },
    h('div', { className: 'flex items-center gap-2 text-xs font-semibold text-kisan-ink/70 py-3' },
      h('button', {
        type: 'button', onClick: logout,
        className: 'ml-auto flex items-center gap-1.5 bg-kisan-ink/5 px-3 py-1.5 rounded-full',
      },
        h('i', { className: 'fa-solid fa-right-from-bracket' }), t('logoutBtn')
      )
    ),

    error && h('div', { className: 'mb-4' }, h(Callout, { tone: 'danger', icon: 'fa-circle-exclamation' }, error)),

    farmerLoading && h('p', { className: 'text-sm text-kisan-ink/60 py-2 flex items-center gap-2' },
      h('i', { className: 'fa-solid fa-circle-notch fa-spin' }), t('loadingYourDetails')
    ),

    farmer && farmer.needsOfficerReview && h(OfficerReviewCard, { farmer }),

    farmer && !farmer.needsOfficerReview && h('div', null,
      h('div', { className: 'mb-4' }, h(FarmerProfileCard, { farmer })),
      h('div', { className: 'grid grid-cols-3 gap-2 mb-4' },
        tabs.map((tb) => h('button', {

          className: `flex flex-col items-center justify-center gap-1 min-h-[3.5rem] rounded-2xl text-sm font-bold border-2 transition ${
            tab === tb.key ? 'bg-kisan-ink text-white border-kisan-ink' : 'bg-kisan-paperRaised text-kisan-ink border-kisan-line'

        },
          h('i', { className: `fa-solid ${tb.icon}` }),
          tb.label
        ))
      ),
      tab === 'book' && h(BookScreen, { farmer, onSwitchTab: setTab }),
      tab === 'status' && h(StatusScreen, { farmer, onSwitchTab: setTab }),
      tab === 'jform' && h(JFormScreen, { farmer, onSwitchTab: setTab })
    )
  );
}

function App() {
  const [lang, setLang] = useState(getInitialLang);

    document.documentElement.lang = lang;
  }, [lang]);

  const changeLang = useCallback((l) => {
    setLang(l);
    persistLang(l);
  }, []);

  return h(LangContext.Provider, { value: lang },
    h('header', { className: 'sticky top-0 z-10 bg-kisan-ink text-white px-4 py-3 border-b border-white/10' },
      h('div', { className: 'max-w-md mx-auto flex items-center justify-between gap-3' },
        h('div', { className: 'flex items-center gap-2.5 min-w-0' },
          h('i', { className: 'fa-solid fa-wheat-awn text-white/80 text-xl flex-none' }),
          h('div', { className: 'min-w-0' },
            h('h1', { className: 'text-lg font-extrabold leading-tight truncate' }, translate(lang, 'appTitle')),
            h('p', { className: 'text-xs text-white/70 leading-tight truncate' }, translate(lang, 'appSubtitle'))
          )
        ),
        h(LanguageSelector, { lang, onChange: changeLang })
      )
    ),
    h(AppBody)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
